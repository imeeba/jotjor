<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="referrer" content="no-referrer">
<title>Jotjor จดจ่อ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#f2f3f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0e12" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="จดจ่อ">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap"></noscript>
<script>try{var th=localStorage.getItem("jotjor_theme");if(th==="light"||th==="dark")document.documentElement.setAttribute("data-theme",th)}catch(e){}</script>
<link rel="stylesheet" href="assets/style.css?v=20">
</head>
<body><div class="wrap">

<section id="setup" class="setup" hidden>
  <h1 data-t="setup.title"></h1>
  <p data-t="setup.intro"></p>
  <form class="form" id="setupForm" autocomplete="off">
    <div class="lab" data-t="setup.url"></div>
    <input id="sUrl" type="url" inputmode="url" autocapitalize="off" spellcheck="false" placeholder="https://script.google.com/macros/s/.../exec">
    <div class="lab" data-t="setup.key"></div>
    <input id="sKey" type="password" autocapitalize="off" spellcheck="false" autocomplete="off">
    <button id="sGo" class="pri" type="submit" data-t="setup.go"></button>
    <div id="sMsg" class="sub" style="margin-top:10px"></div>
  </form>
</section>

<section id="main" hidden>
  <nav class="tabs" id="tabs"><button id="tabOut" class="on" type="button" data-t="tab.out"></button><button id="tabIn" type="button" data-t="tab.in"></button></nav>
  <div class="top" id="topbar">
    <button id="prev" data-aria="top.prev"><i class="ic ic-prev"></i></button>
    <div class="mid"><div class="cl" id="cyc">&nbsp;</div><div class="sub" id="upd">&nbsp;</div></div>
    <button id="next" data-aria="top.next"><i class="ic ic-next"></i></button>
    <button id="rf" data-aria="top.refresh"><i class="ic ic-refresh"></i></button>
    <button id="gear" class="gear" data-aria="top.settings"><i class="ic ic-settings"></i></button>
  </div>
  <div id="err" class="err" hidden></div>
  <button id="newver" class="newver" type="button" hidden data-t="app.newVersion"></button>
  <div id="hold" hidden></div>
  <div id="sheet" class="sheetwrap" hidden>
    <div id="sheetbg" class="sheetbg"></div>
    <section class="card sheetbox" id="cashbox">
      <div class="chead"><h2 data-t="cash.add"></h2><button id="cashClose" class="xbtn" type="button" data-aria="cash.close"><i class="ic ic-x"></i></button></div>
      <div class="cf" id="cashform">
        <div class="seg"><button id="cout" class="on" type="button" data-t="cash.out"></button><button id="cin" type="button" data-t="cash.in"></button></div>
        <input id="camt" type="text" inputmode="decimal" data-ph="cash.amount" autocomplete="off">
        <input id="cmer" type="text" maxlength="40" data-ph="cash.merchant" autocomplete="off">
        <button id="cwhen" class="selbtn whenbtn" type="button"></button>
        <button id="cgo" class="pri" type="button" data-t="cash.save"></button>
        <div id="cmsg" class="sub" style="margin-top:8px"></div>
      </div>
    </section>
  </div>
  <div id="app"><div class="skel" role="status" data-aria="app.loading"><i class="sk h"></i><div class="skr"><i class="sk"></i><i class="sk"></i></div><i class="sk"></i><i class="sk"></i></div></div>
</section>

<section id="stream" hidden>
  <div class="sethead"><button id="stback" class="backbtn" type="button" data-aria="settings.back"><i class="ic ic-back"></i></button><h1 id="sttitle"></h1></div>
  <div class="capsule">
    <button id="stprev" type="button" data-aria="top.prev"><i class="ic ic-prev"></i></button>
    <div class="mid"><div class="cl" id="stcyc">&nbsp;</div><div class="sub" id="stupd">&nbsp;</div></div>
    <button id="stnext" type="button" data-aria="top.next"><i class="ic ic-next"></i></button>
  </div>
  <div id="stapp"></div>
</section>

<section id="ov" hidden>
  <div class="sethead"><button id="ovback" class="backbtn" type="button" data-aria="settings.back"><i class="ic ic-back"></i></button><h1 data-t="ov.title"></h1></div>
  <nav class="tabs"><button id="ovOut" class="on" type="button" data-t="tab.out"></button><button id="ovIn" type="button" data-t="tab.in"></button></nav>
  <div class="capsule">
    <button id="ovprev" type="button" data-aria="top.prev"><i class="ic ic-prev"></i></button>
    <div class="mid"><div class="cl" id="ovcyc">&nbsp;</div><div class="sub" id="ovupd">&nbsp;</div></div>
    <button id="ovnext" type="button" data-aria="top.next"><i class="ic ic-next"></i></button>
  </div>
  <div id="ovapp"></div>
</section>

<section id="settings" hidden>
  <div class="sethead"><button id="setback" class="backbtn" type="button" data-aria="settings.back"><i class="ic ic-back"></i></button><h1 data-t="settings.title"></h1><button id="themeBtn" class="themebtn" type="button"><i class="ic ic-monitor"></i></button></div>
  <section class="card setcard" id="cybox"></section>
  <section class="card setcard" id="cpbox"></section>
  <section class="card setcard" id="accbox"></section>
  <section class="card setcard" id="mgbox"></section>
  <button id="aboutRow" class="card setcard navrow" type="button"><img src="icons/icon-192.png" alt="" width="32" height="32"><span data-t="about.row"></span><i class="ic ic-next"></i></button>
  <section class="card setcard"><div class="sub" data-t="settings.connected"></div>
    <button id="logout" class="dng" type="button" data-t="settings.logout"></button></section>
</section>

<section id="about" hidden>
  <div class="sethead"><button id="aboutback" class="backbtn" type="button" data-aria="settings.back"><i class="ic ic-back"></i></button><h1 data-t="about.title"></h1></div>
  <section class="card abhero">
    <img src="icons/icon-192.png" alt="" width="72" height="72">
    <h1 data-t="about.name"></h1>
    <p data-tw="about.bless1"></p>
    <p data-tw="about.bless2"></p>
    <p class="enjoy" data-t="about.enjoy"></p>
  </section>
  <section class="card setcard abinfo">
    <div class="kv"><span data-t="about.dev"></span><b data-t="about.company"></b></div>
    <div class="kv"><span data-t="about.email"></span><a href="mailto:hello@tamada.io">hello@tamada.io</a></div>
    <div class="kv"><span data-t="about.source"></span><a href="https://github.com/imeeba/jotjor" target="_blank" rel="noopener">GitHub</a></div>
    <div class="kv"><span data-t="about.version"></span><b id="abver"></b></div>
    <div class="sub ablic" data-t="about.license"></div>
  </section>
</section>

<div id="mini" class="mini-top" role="button" tabindex="0" hidden></div>
<div id="fsheet" class="sheetwrap" hidden>
  <div class="sheetbg" id="fsbg"></div>
  <section class="card sheetbox" role="dialog" aria-modal="true" aria-labelledby="fsTitle"><div class="chead"><h2 id="fsTitle"></h2><button id="fsClose" class="xbtn" type="button" data-aria="cash.close"><i class="ic ic-x"></i></button></div><div id="fsBody" class="fsbody"></div></section>
</div>
<div id="dsheet" class="sheetwrap" hidden>
  <div class="sheetbg" id="dsbg"></div>
  <section class="card sheetbox" role="dialog" aria-modal="true" aria-labelledby="dsTitle"><div class="chead"><h2 id="dsTitle" data-t="date.title"></h2><button id="dsClose" class="xbtn" type="button" data-aria="cash.close"><i class="ic ic-x"></i></button></div><div id="dsBody"></div></section>
</div>
<div id="picker" class="sheetwrap" hidden>
  <div class="sheetbg" id="pkbg"></div>
  <section class="card sheetbox pkbox" role="dialog" aria-modal="true" aria-labelledby="pkTitle"><i class="grab"></i><h2 id="pkTitle"></h2><div id="pkList" class="pklist"></div></section>
</div>
<div id="toast" class="toast" role="alert" hidden></div>

</div>
<script src="assets/strings.js?v=20"></script>
<script src="assets/app.js?v=20"></script>
</body></html>
