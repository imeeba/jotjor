<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Jotjor จดจ่อ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<script>try{var th=localStorage.getItem("jotjor_theme");if(th==="light"||th==="dark")document.documentElement.setAttribute("data-theme",th)}catch(e){}</script>
<link rel="stylesheet" href="assets/style.css?v=4">
</head>
<body><div class="wrap">

<section id="setup" class="setup" hidden>
  <h1 data-t="setup.title"></h1>
  <p data-t="setup.intro"></p>
  <form class="form" id="setupForm" autocomplete="off">
    <div class="lab" data-t="setup.url"></div>
    <input id="sUrl" type="url" inputmode="url" autocapitalize="off" spellcheck="false" placeholder="https://script.google.com/macros/s/.../exec">
    <div class="lab" data-t="setup.key"></div>
    <input id="sKey" type="password" autocapitalize="off" spellcheck="false" autocomplete="off">
    <button id="sGo" class="pri" type="submit" data-t="setup.go"></button>
    <div id="sMsg" class="sub" style="margin-top:10px"></div>
  </form>
</section>

<section id="main" hidden>
  <nav class="tabs" id="tabs"><button id="tabOut" class="on" type="button" data-t="tab.out"></button><button id="tabIn" type="button" data-t="tab.in"></button></nav>
  <div class="top" id="topbar">
    <button id="prev" data-aria="top.prev"><i class="ic ic-prev"></i></button>
    <div class="mid"><div class="cl" id="cyc">&nbsp;</div><div class="sub" id="upd">&nbsp;</div></div>
    <button id="next" data-aria="top.next"><i class="ic ic-next"></i></button>
    <button id="rf" data-aria="top.refresh"><i class="ic ic-refresh"></i></button>
    <button id="gear" class="gear" data-aria="top.settings"><i class="ic ic-settings"></i></button>
  </div>
  <div id="err" class="err" hidden></div>
  <div id="hold" hidden>  <section class="card" id="cashbox">
    <div id="cashhead"></div>
    <button id="cashToggle" class="pri addbtn" type="button" data-t="cash.add"></button>
    <div class="cf" id="cashform" hidden>
      <div class="seg"><button id="cout" class="on" type="button" data-t="cash.out"></button><button id="cin" type="button" data-t="cash.in"></button></div>
      <input id="camt" type="text" inputmode="decimal" data-ph="cash.amount" autocomplete="off">
      <input id="cmer" type="text" maxlength="40" data-ph="cash.merchant" autocomplete="off">
      <input id="cwhen" type="datetime-local" data-aria="cash.when">
      <button id="cgo" class="pri" type="button" data-t="cash.save"></button>
      <div id="cmsg" class="sub" style="margin-top:8px"></div>
    </div>
  </section></div>
  <div id="app"><div class="sub" style="padding:24px 0" data-t="app.loading"></div></div>
</section>

<section id="settings" hidden>
  <div class="sethead"><button id="setback" type="button" data-aria="settings.back"><i class="ic ic-prev"></i></button><h1 data-t="settings.title"></h1></div>
  <section class="card setcard"><h2 data-t="settings.theme"></h2>
    <div class="seg" id="themeSeg"><button type="button" data-th="system" data-t="theme.system"></button><button type="button" data-th="light" data-t="theme.light"></button><button type="button" data-th="dark" data-t="theme.dark"></button></div>
  </section>
  <section class="card setcard" id="mgbox"></section>
  <section class="card setcard"><div class="sub" data-t="settings.connected"></div>
    <button id="logout" class="dng" type="button" data-t="settings.logout"></button></section>
</section>

</div>
<script src="assets/strings.js?v=4"></script>
<script src="assets/app.js?v=4"></script>
</body></html>
